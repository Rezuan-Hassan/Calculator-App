<script>
(() => {
  let primaryDisplay = '30000';
  let expressionDisplay = '1,250 × 24 +';
  let lastResult = '30,000';
  let waitingForNewOperand = false;

  const primaryEl = document.getElementById('primary-output');
  const expressionEl = document.getElementById('expression-text');
  const ansChipEl = document.getElementById('ans-chip-text');
  const copyBtn = document.getElementById('copy-badge');
  const clearTapeBtn = document.getElementById('clear-tape-btn');
  const displayBox = document.getElementById('calculator-display');

  function formatNumberWithCommas(str) {
    if (!str) return '0';
    if (str === 'Error' || str === 'NaN') return str;
    const parts = str.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return parts.join('.');
  }

  function updateView() {
    primaryEl.textContent = formatNumberWithCommas(primaryDisplay);
    expressionEl.textContent = expressionDisplay;
    ansChipEl.textContent = `Ans = ${formatNumberWithCommas(lastResult)}`;
  }

  function sanitizeForEval(expr) {
    return expr
      .replace(/,/g, '')
      .replace(/×/g, '*')
      .replace(/÷/g, '/')
      .replace(/−/g, '-');
  }

  function evaluateCurrent() {
    try {
      const fullExpression = expressionDisplay + (waitingForNewOperand ? '' : primaryDisplay);
      const clean = sanitizeForEval(fullExpression);
      if (!clean) return;
      const calcResult = Function('"use strict";return (' + clean + ')')();
      if (isNaN(calcResult) || !isFinite(calcResult)) {
        primaryDisplay = 'Error';
      } else {
        const rounded = Number(Math.round(calcResult + 'e+8') + 'e-8');
        primaryDisplay = String(rounded);
        lastResult = primaryDisplay;
      }
    } catch (e) {
      primaryDisplay = 'Error';
    }
    expressionDisplay = '';
    waitingForNewOperand = true;
    updateView();
  }

  function handleKey(key) {
    if (window.navigator?.vibrate) {
      window.navigator.vibrate(8);
    }

    if (key >= '0' && key <= '9') {
      if (waitingForNewOperand || primaryDisplay === '0' || primaryDisplay === 'Error') {
        primaryDisplay = key;
        waitingForNewOperand = false;
      } else {
        if (primaryDisplay.replace('.', '').length < 12) {
          primaryDisplay += key;
        }
      }
      updateView();
      return;
    }

    if (key === '.') {
      if (waitingForNewOperand || primaryDisplay === 'Error') {
        primaryDisplay = '0.';
        waitingForNewOperand = false;
      } else if (!primaryDisplay.includes('.')) {
        primaryDisplay += '.';
      }
      updateView();
      return;
    }

    if (key === 'AC') {
      primaryDisplay = '0';
      expressionDisplay = '';
      waitingForNewOperand = false;
      updateView();
      return;
    }

    if (key === 'BACKSPACE') {
      if (primaryDisplay === 'Error' || waitingForNewOperand) {
        primaryDisplay = '0';
      } else if (primaryDisplay.length > 1) {
        primaryDisplay = primaryDisplay.slice(0, -1);
      } else {
        primaryDisplay = '0';
      }
      updateView();
      return;
    }

    if (key === '%') {
      const num = parseFloat(primaryDisplay);
      if (!isNaN(num)) {
        primaryDisplay = String(num / 100);
        updateView();
      }
      return;
    }

    if (key === '()') {
      if (primaryDisplay.startsWith('(') && primaryDisplay.endsWith(')')) {
        primaryDisplay = primaryDisplay.slice(1, -1);
      } else {
        primaryDisplay = `(${primaryDisplay})`;
      }
      updateView();
      return;
    }

    if (['+', '−', '×', '÷'].includes(key)) {
      if (expressionDisplay !== '' && !waitingForNewOperand) {
        try {
          const interim = sanitizeForEval(expressionDisplay + primaryDisplay);
          const res = Function('"use strict";return (' + interim + ')')();
          primaryDisplay = String(Number(Math.round(res + 'e+8') + 'e-8'));
          lastResult = primaryDisplay;
        } catch (e) {}
      }
      expressionDisplay = `${formatNumberWithCommas(primaryDisplay)} ${key} `;
      waitingForNewOperand = true;
      updateView();
      return;
    }

    if (key === '=') {
      evaluateCurrent();
    }
  }

  // Bind keypad events
  document.querySelectorAll('.calc-btn').forEach(button => {
    button.addEventListener('click', (e) => {
      const key = button.getAttribute('data-key');
      handleKey(key);

      // Micro ripple effect
      const circle = document.createElement('span');
      const diameter = Math.max(button.clientWidth, button.clientHeight);
      const radius = diameter / 2;
      const rect = button.getBoundingClientRect();
      circle.style.width = circle.style.height = `${diameter}px`;
      circle.style.left = `${e.clientX - rect.left - radius}px`;
      circle.style.top = `${e.clientY - rect.top - radius}px`;
      circle.classList.add('absolute', 'rounded-full', 'bg-on-surface/10', 'pointer-events-none', 'animate-ping');
      button.appendChild(circle);
      setTimeout(() => circle.remove(), 400);
    });
  });

  // Swipe gesture support on readout display for single backspace
  let touchStartX = 0;
  displayBox.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
  }, { passive: true });

  displayBox.addEventListener('touchend', (e) => {
    const touchEndX = e.changedTouches[0].screenX;
    if (touchStartX - touchEndX > 45) {
      handleKey('BACKSPACE');
    }
  }, { passive: true });

  // Quick Copy interaction
  copyBtn.addEventListener('click', () => {
    const textToCopy = primaryDisplay;
    navigator.clipboard?.writeText(textToCopy);
    const span = copyBtn.querySelector('span:last-child');
    const prev = span.textContent;
    span.textContent = 'Copied!';
    setTimeout(() => { span.textContent = prev; }, 1200);
  });

  // Clear Tape button
  clearTapeBtn.addEventListener('click', () => {
    expressionDisplay = '';
    updateView();
  });

  // Mode button toggle demo
  const modeStd = document.getElementById('mode-std');
  const modeSci = document.getElementById('mode-sci');

  modeSci.addEventListener('click', () => {
    modeSci.textContent = modeSci.textContent === 'DEG' ? 'RAD' : 'DEG';
  });

  updateView();
})();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-2px_12px_rgba(0,0,0,0.04)]" data-active-classes="bg-secondary-fixed text-on-secondary-fixed font-semibold shadow-[0_2px_6px_rgba(15,23,42,0.04)]"></nav>
